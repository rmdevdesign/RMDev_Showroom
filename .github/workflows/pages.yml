name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v6
      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier le code
        run: npm run lint
      - name: Exécuter les tests unitaires
        run: npm test
      - name: Compiler le showroom
        run: npm run build
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Transférer le site compilé
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier le showroom
        id: deployment
        uses: actions/deploy-pages@v4
